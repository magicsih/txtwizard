name: Check Svelte TypeScript and Unit Tests

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # - name: Run ESLint
      #   run: npm run lint

      - name: Run Type Check
        run: npm run check

      - name: Run Unit Tests
        run: npm test -- --run
